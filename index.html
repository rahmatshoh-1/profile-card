<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />

        <title>Frontend Mentor | Social links profile</title>
        <link rel="stylesheet" href="/assets/styles/style.css" />
        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution {
                font-size: 0.6875rem;
                text-align: center;
            }
            .attribution a {
                color: hsl(228, 45%, 44%);
            }
        </style>
    </head>
    <body>
        <div class="social-profile">
            <div class="social-profile-block">
                <img
                    class="img-avatar"
                    src="/assets/images/avatar-jessica.jpeg"
                    alt="avatar-jessica"
                />
                <h1 class="social-profile-name">Jessica Randall</h1>
                <p class="social-profile-address">London, United Kingdom</p>
                <p class="social-profile-job">
                    "Front-end developer and avid reader."
                </p>
            </div>

            <div class="social-profile-links">
                <a class="social-profile-link" href="#">GitHub</a>
                <a class="social-profile-link" href="#">Frontend Mentor</a>
                <a class="social-profile-link" href="#">LinkedIn</a>
                <a class="social-profile-link" href="#">Twitter</a>
                <a class="social-profile-link" href="#">Instagram</a>
            </div>
        </div>

        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="#">Your Name Here</a>.
        </footer>
    </body>
</html>
